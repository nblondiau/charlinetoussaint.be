<div id="lightbox" class="lightbox" hidden>
  <button class="lightbox__button lightbox__close" type="button" aria-label="Fermer">×</button>
  <button class="lightbox__button lightbox__prev" type="button" aria-label="Image précédente">‹</button>
  <button class="lightbox__button lightbox__next" type="button" aria-label="Image suivante">›</button>
  <figure class="lightbox__figure">
    <img class="lightbox__img" alt="">
    <figcaption class="lightbox__caption"></figcaption>
  </figure>
</div>
