{{ define "main" }}
<article class="entry">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ if not .Date.IsZero }}<p class="entry__meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p>{{ end }}
    {{ with .Params.subtitle }}<p class="page-header__subtitle">{{ . }}</p>{{ end }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
