{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
</header>
{{- range .Paginator.Pages }}
<article class="entry">
  <h2 class="entry__title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  {{ with .Summary }}<div class="prose">{{ . }}</div>{{ end }}
</article>
{{- end }}
{{ partial "pager.html" . }}
{{ end }}
