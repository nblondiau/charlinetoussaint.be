---
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - id: pages
      uses: actions/configure-pages@v6
    - name: Cache Hugo image transforms
      uses: actions/cache@v6
      with:
        path: resources/_gen
        key: hugo-${{ hashFiles('content/**', 'assets/**', 'layouts/**', 'hugo.toml') }}
        restore-keys: hugo-
    - name: Install Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.169.0'
        extended: true
    - name: Build
      env:
        HUGO_SERVICES_GOOGLEANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
        HUGO_PARAMS_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      run: hugo --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}/"
    - name: Enforce size budget
      run: |
        bytes=$(du -sb public | cut -f1)
        echo "published site: $((bytes / 1048576)) MB of 1024 MB"
        test "$bytes" -lt 900000000
    - uses: actions/upload-pages-artifact@v5
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
